<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paimon Labs</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/black.css" />
  </head>
  <body>
    <main class="black-page">
      <div class="audio-control">
        <audio id="site-audio" src="/audio/interstellar-organ.mp3" preload="none"></audio>
        <button id="audio-toggle" type="button" aria-label="Play music" aria-pressed="false">
          <span class="audio-icon" aria-hidden="true">▶</span><span class="audio-label">PLAY SOUND</span>
        </button>
      </div>
    </main>
    <script>
      const audio = document.getElementById('site-audio');
      const button = document.getElementById('audio-toggle');
      const icon = button.querySelector('.audio-icon');
      const label = button.querySelector('.audio-label');
      function setPlaying(playing) {
        button.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
        button.setAttribute('aria-pressed', String(playing));
        icon.textContent = playing ? 'Ⅱ' : '▶';
        label.textContent = playing ? 'PAUSE SOUND' : 'PLAY SOUND';
      }
      button.addEventListener('click', async () => {
        if (audio.paused) {
          try { await audio.play(); setPlaying(true); } catch { setPlaying(false); }
        } else {
          audio.pause();
          setPlaying(false);
        }
      });
      audio.addEventListener('ended', () => setPlaying(false));
    </script>
  </body>
</html>
